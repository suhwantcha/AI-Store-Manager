services:
  db:
    image: postgres:16-alpine
    container_name: ai_store_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_store_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
